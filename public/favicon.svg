<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --bg: #111111;
      --fg: #f6f5f0;
      --mute: #8e8d85;
      --line: #262626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #f6f5f0;
        --fg: #111111;
        --mute: #6e6d67;
        --line: #dcd8cf;
      }
    }
    .badge { fill: var(--bg); }
    .border { stroke: var(--line); stroke-width: 1; fill: none; }
    text {
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .fg { fill: var(--fg); }
    .sub { fill: var(--mute); font-weight: 500; }
  </style>
  <rect class="badge" width="32" height="32" rx="4"/>
  <rect class="border" x="0.5" y="0.5" width="31" height="31" rx="3.5"/>
  <text x="16" y="20.5" text-anchor="middle">
    <tspan class="fg">0x</tspan><tspan class="sub">Ab</tspan>
  </text>
</svg>
